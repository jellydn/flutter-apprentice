def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def requiredProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingProperties = requiredProperties.findAll {
    !signingProperties.getProperty(it)?.trim()
}
def keystorePath = signingProperties.getProperty('storeFile')

android {
    compileSdkVersion 30

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.productsway.recipes"
        minSdkVersion 16
        targetSdkVersion 30
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            storeFile = keystorePath?.trim() ? rootProject.file(keystorePath) : null
            storePassword = signingProperties.getProperty('storePassword')
            keyAlias = signingProperties.getProperty('keyAlias')
            keyPassword = signingProperties.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

// Check the actual release task graph, including aggregate and Flutter builds.
// Debug builds and IDE sync must not require private release credentials.
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        gradle.taskGraph.whenReady { graph ->
            if (graph.hasTask(variant.preBuildProvider.get())) {
                if (missingProperties) {
                    throw new GradleException(
                        "Release signing requires android/key.properties with non-empty: " +
                        missingProperties.join(', ') + ". See recipes/README.md."
                    )
                }
                if (!android.signingConfigs.release.storeFile.isFile()) {
                    throw new GradleException(
                        "Release signing requires an existing keystore file. " +
                        "Check storeFile in android/key.properties. See recipes/README.md."
                    )
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
